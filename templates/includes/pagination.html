{% if page_obj.paginator.num_pages > 1 %}
    <nav class="mt-4" aria-label="Постраничная навигация">
        <ul class="pagination flex-wrap align-items-center">
            {% if page_obj.has_previous %}
                <li class="page-item"><a class="page-link" href="{% querystring page=1 %}">Первая</a></li>
                <li class="page-item"><a class="page-link" href="{% querystring page=page_obj.previous_page_number %}" rel="prev">Предыдущая</a></li>
            {% endif %}
            <li class="page-item active"><span class="page-link" aria-current="page">{{ page_obj.number }} из {{ page_obj.paginator.num_pages }}</span></li>
            {% if page_obj.has_next %}
                <li class="page-item"><a class="page-link" href="{% querystring page=page_obj.next_page_number %}" rel="next">Следующая</a></li>
                <li class="page-item"><a class="page-link" href="{% querystring page=page_obj.paginator.num_pages %}">Последняя</a></li>
            {% endif %}
        </ul>
    </nav>
{% endif %}
