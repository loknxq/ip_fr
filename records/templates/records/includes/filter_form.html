<form method="get" class="card card-body mb-4" aria-label="Фильтры пластинок">
    {% if form.errors %}
        <div class="alert alert-danger" role="alert">
            Исправьте параметры поиска. До исправления список не отображается.
            {{ form.non_field_errors }}
        </div>
    {% endif %}
    <div class="row g-3">
        {% for field in form %}
            <div class="col-md-4">
                {{ field.label_tag }}
                {{ field }}
                {% if field.errors %}<div class="text-danger">{{ field.errors }}</div>{% endif %}
            </div>
        {% endfor %}
    </div>
    <div class="mt-3">
        <button type="submit" class="btn btn-primary">Применить</button>
        <a href="{% url 'records:records' %}" class="btn btn-outline-secondary">Сбросить</a>
    </div>
</form>
