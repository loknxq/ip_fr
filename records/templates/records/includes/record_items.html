<ul class="list-group">
    {% for record in records %}
        <li class="list-group-item">
            <a href="{% url 'records:record_detail' record.id %}">
                {{ record.title }} — {{ record.artist }}
            </a>
            {% if record.year %}({{ record.year }}){% endif %}
            <span class="text-muted">· {{ record.genre|default:"Жанр не указан" }}</span>
        </li>
    {% empty %}
        <li class="list-group-item">Пластинки не найдены. Измените фильтры или сбросьте их.</li>
    {% endfor %}
</ul>
